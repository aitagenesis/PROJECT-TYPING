<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Typing Test{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">{% block head %}{% endblock %}</head>
<body><header class="site-header"><a class="brand" href="{{ url_for('index') }}">Typing Test</a>
<nav><a href="{{ url_for('index') }}">Home</a><a href="{{ url_for('leaderboard') }}">Leaderboard</a>
{% if session.get('user_id') %}<a href="{{ url_for('profile') }}">Profile</a><a href="{{ url_for('logout') }}">Log out</a>
{% else %}<a href="{{ url_for('login') }}">Log in</a><a href="{{ url_for('register') }}">Register</a>{% endif %}</nav></header>
<main class="container">{% for message in get_flashed_messages() %}<p class="notice">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
