{% extends "base.html" %}{% block title %}Typing test{% endblock %}{% block head %}<script defer src="{{ url_for('static', filename='js/typing.js') }}"></script>{% endblock %}
{% block content %}<section class="panel"><h1>Typing test</h1><p id="sample">The best way to improve your typing is to practise a little every day.</p><textarea id="typing-input" placeholder="Start typing the passage here..." rows="5"></textarea><div class="stats"><span>Time: <strong id="time">60</strong>s</span><span>WPM: <strong id="wpm">0</strong></span><span>Accuracy: <strong id="accuracy">100</strong>%</span></div><button class="button" id="start-test">Start / restart</button><p id="test-message" aria-live="polite"></p></section>{% endblock %}
