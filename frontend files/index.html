<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typer Teaser</title>
  
  <!-- Links your CSS stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="teaser-container">
    <!-- Teaser Title -->
    <h1 id="teaser-title" class="title">READY TO TYPE?</h1>

    <!-- SpongeBob-Style Monster SVG Graphic -->
    <svg class="teaser-monster" viewBox="0 0 260 260" width="240" height="240" xmlns="http://www.w3.org/2000/svg">
      <!-- Wacky Wiggly Arms / Tentacles -->
      <path d="M 40 140 Q 15 110 30 80 Q 45 100 55 120" fill="#00D2D3" stroke="#1E1E1E" stroke-width="4" stroke-linejoin="round"/>
      <path d="M 220 140 Q 245 110 230 80 Q 215 100 205 120" fill="#00D2D3" stroke="#1E1E1E" stroke-width="4" stroke-linejoin="round"/>

      <!-- Sponge-like / Wavy Cartoon Body -->
      <path d="M 50 80 Q 30 40 90 45 Q 130 20 170 45 Q 230 40 210 90 Q 240 140 200 180 Q 220 230 160 220 Q 130 250 100 220 Q 40 230 60 170 Q 20 130 50 80 Z" fill="#00D2D3" stroke="#1E1E1E" stroke-width="5"/>

      <!-- Goofy Freckles / Spots -->
      <circle cx="75" cy="110" r="8" fill="#019092" opacity="0.6"/>
      <circle cx="185" cy="120" r="10" fill="#019092" opacity="0.6"/>
      <circle cx="165" cy="190" r="6" fill="#019092" opacity="0.6"/>

      <!-- Crazy Bug Eyes -->
      <circle cx="95" cy="100" r="24" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="4"/>
      <circle cx="102" cy="100" r="8" fill="#1E1E1E"/>
      <circle cx="99" cy="97" r="3" fill="#FFFFFF"/>

      <circle cx="155" cy="95" r="20" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="4"/>
      <circle cx="150" cy="95" r="7" fill="#1E1E1E"/>
      <circle cx="148" cy="92" r="2.5" fill="#FFFFFF"/>
      <g class="tears" opacity="0">
        <path d="M 85 125 Q 90 145 85 155 Q 78 145 85 125 Z" fill="#38BDF8"/>
        <path d="M 165 125 Q 170 145 165 155 Q 158 145 165 125 Z" fill="#38BDF8"/>
      </g>


      <path d="M 75 70 Q 95 50 115 75" stroke="#1E1E1E" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 135 70 Q 155 50 175 65" stroke="#1E1E1E" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 75 140 Q 125 210 175 140" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="4"/>
      <path d="M 75 140 Q 125 210 175 140" fill="none" stroke="#1E1E1E" stroke-width="4"/>
      <rect x="110" y="140" width="14" height="20" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="3"/>
      <rect x="126" y="140" width="14" height="20" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="3"/>
      <path class="monster-tongue" d="M 110 185 Q 125 220 140 185 Z" fill="#FF5252" stroke="#1E1E1E" stroke-width="3"/>
    </svg>
    

    <button id="start-btn" class="teaser-btn">PRESS ANY KEY</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
